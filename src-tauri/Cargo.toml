[package]
name = "confinaid-test-tool"
version = "0.2.3"
description = "Confinaid Test Tool — desktop testing harness for the Confinaid API"
authors = ["Compuvi"]
license = "Apache-2.0"
repository = "https://github.com/Compuvi/confinaid-test-tool"
edition = "2021"
rust-version = "1.77"

[lib]
# The _lib suffix avoids a name collision with the binary target on Windows.
name = "confinaid_test_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
reqwest = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Still deliberately absent: chrono, uuid, hdrhistogram, governor, rusqlite.
