[workspace]
members = ["src-tauri"]
resolver = "2"

# Shared across the workspace so a future confinaid-test-tool-core crate
# cannot drift to a different serde/tokio major.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["time"] }
futures-util = "0.3"
sha2 = "0.11"
hex = "0.4"
