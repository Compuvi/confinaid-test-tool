version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      # One PR per week for the routine churn; majors still arrive alone so
      # they get read properly.
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned deliberately to match the Tauri crate version in
      # src-tauri/Cargo.toml. Bump both together, by hand.
      - dependency-name: "@tauri-apps/api"
      - dependency-name: "@tauri-apps/cli"

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]

  # Keeps the SHA-pinned actions in .github/workflows current. Without this,
  # pinning becomes a maintenance tax instead of a security control.
  #
  # The PR limit is raised above the default of 5: the first run hit that cap
  # and silently dropped actions/upload-artifact, which would have left it a
  # major behind actions/download-artifact. Paired actions must not be split
  # across a truncation boundary.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
