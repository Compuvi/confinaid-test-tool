name: Feature request
description: Suggest a capability for the test tool
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the testing scenario you cannot cover today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like the tool to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
