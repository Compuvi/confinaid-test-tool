name: Build & Upload Installers

# Fires when semantic-release publishes a new GitHub Release.
# Also supports manual re-runs (pass the existing tag if installers are missing).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0) — must already exist as a GitHub Release"
        required: true

# ─── Shared setup ────────────────────────────────────────────────────────────

permissions:
  contents: write # required to upload assets to GitHub Releases

env:
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Resolve the release tag and ID for all downstream jobs
  # ──────────────────────────────────────────────────────────────────────────
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get release ID
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ steps.tag.outputs.tag }}" \
               --jq '.id')
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────
  # Windows: .msi + NSIS -setup.exe
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    needs: resolve-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Windows)
        run: pnpm tauri build --bundles msi,nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.resolve-release.outputs.release_id }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        shell: bash
        run: |
          gh release upload "${{ needs.resolve-release.outputs.tag }}" \
            target/release/bundle/msi/*.msi \
            target/release/bundle/nsis/*-setup.exe \
            --clobber

  # ──────────────────────────────────────────────────────────────────────────
  # macOS: universal DMG (x86_64 + aarch64 merged)
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    needs: resolve-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable + targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (macOS universal)
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.resolve-release.outputs.tag }}" \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            --clobber

  # ──────────────────────────────────────────────────────────────────────────
  # Linux: .AppImage + .deb
  # ──────────────────────────────────────────────────────────────────────────
  build-linux:
    needs: resolve-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            libssl-dev \
            pkg-config

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Linux)
        run: pnpm tauri build --bundles appimage,deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.resolve-release.outputs.tag }}" \
            target/release/bundle/appimage/*.AppImage \
            target/release/bundle/deb/*.deb \
            --clobber

  # ──────────────────────────────────────────────────────────────────────────
  # Generate update-manifest.json and upload it to the release.
  # Runs after all platform builds complete so the SHA-256 digests are final.
  # ──────────────────────────────────────────────────────────────────────────
  generate-manifest:
    needs: [resolve-release, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and upload update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          node scripts/generate-manifest.mjs \
            "${{ needs.resolve-release.outputs.version }}" \
            "${{ needs.resolve-release.outputs.release_id }}"
