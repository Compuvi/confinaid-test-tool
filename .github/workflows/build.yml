name: Build & Upload Installers

# Fires when semantic-release publishes a new GitHub Release.
# Also supports manual re-runs (pass the existing tag if installers are missing).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0) — must already exist as a GitHub Release"
        required: true

# ─── Shared setup ────────────────────────────────────────────────────────────

permissions:
  contents: write # required to upload assets to GitHub Releases

env:
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Resolve the release tag and ID for all downstream jobs
  # ──────────────────────────────────────────────────────────────────────────
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get release ID
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ steps.tag.outputs.tag }}" \
               --jq '.id')
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────
  # Windows: build unsigned .msi + NSIS .exe, then sign on Linux
  # (sslcom/actions-codesigner is a Docker action — only runs on Linux)
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    needs: resolve-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Windows — unsigned)
        run: pnpm tauri build --bundles msi,nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename installers (replace spaces with hyphens for CodeSignTool)
        shell: pwsh
        run: |
          Get-ChildItem -Path "target\release\bundle" -Recurse -File |
            Where-Object { $_.Name -match ' ' } |
            ForEach-Object {
              $newName = $_.Name -replace ' ', '-'
              Rename-Item -Path $_.FullName -NewName $newName
              Write-Host "Renamed: $($_.Name) -> $newName"
            }

      - name: Upload unsigned Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Sign Windows installers with SSL.com eSigner on a Linux runner.
  # Docker-based actions (like sslcom/actions-codesigner) do not run on
  # GitHub's Windows runners; we run CodeSignTool directly on ubuntu instead.
  # ──────────────────────────────────────────────────────────────────────────
  sign-windows:
    needs: [resolve-release, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned Windows installers
        uses: actions/download-artifact@v4
        with:
          name: windows-unsigned-installers
          path: unsigned-installers

      - name: Locate installer paths
        run: |
          mkdir -p signed-artifacts
          NSIS_EXE=$(find unsigned-installers -name "*.exe" ! -name "*.sig" -type f | head -1)
          MSI_FILE=$(find unsigned-installers -name "*.msi" ! -name "*.sig" -type f | head -1)
          echo "NSIS_EXE_PATH=$NSIS_EXE" >> "$GITHUB_ENV"
          echo "MSI_FILE_PATH=$MSI_FILE"  >> "$GITHUB_ENV"
          echo "Found NSIS: $NSIS_EXE"
          echo "Found MSI:  $MSI_FILE"

      # Bullseye LTS ended Aug 2026 — run CodeSignTool directly on the runner
      # (no Docker/APT needed) to avoid the expired InRelease issue.
      - name: Setup Java 11 for CodeSignTool
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Download and prepare CodeSignTool
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/SSLcom/actions-codesigner/raw/develop/CodeSignTool-v1.2.7.zip" \
            -o /tmp/CodeSignTool.zip
          unzip -q /tmp/CodeSignTool.zip -d /tmp/codesign-extract
          mv /tmp/codesign-extract/CodeSignTool-v1.2.7 /tmp/codesign-tool
          chmod +x /tmp/codesign-tool/CodeSignTool.sh
          mkdir -p /tmp/codesign-tool/conf
          curl -sSfL \
            "https://raw.githubusercontent.com/SSLcom/actions-codesigner/develop/codesign-tool/conf/code_sign_tool.properties" \
            -o /tmp/codesign-tool/conf/code_sign_tool.properties
          echo "CodeSignTool ready"

      - name: Sign Windows NSIS installer
        env:
          CST_USERNAME: ${{ secrets.ES_USERNAME }}
          CST_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CST_CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          CST_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          set -euo pipefail
          cd /tmp/codesign-tool
          ./CodeSignTool.sh sign \
            -username="$CST_USERNAME" \
            -password="$CST_PASSWORD" \
            -credential_id="$CST_CREDENTIAL_ID" \
            -totp_secret="$CST_TOTP_SECRET" \
            -input_file_path="${GITHUB_WORKSPACE}/${NSIS_EXE_PATH}" \
            -output_dir_path="${GITHUB_WORKSPACE}/signed-artifacts" \
            -malware_block=false
          echo "Signed NSIS:"
          ls -lh "${GITHUB_WORKSPACE}/signed-artifacts/"

      - name: Sign Windows MSI installer
        if: env.MSI_FILE_PATH != ''
        env:
          CST_USERNAME: ${{ secrets.ES_USERNAME }}
          CST_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CST_CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          CST_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          set -euo pipefail
          cd /tmp/codesign-tool
          ./CodeSignTool.sh sign \
            -username="$CST_USERNAME" \
            -password="$CST_PASSWORD" \
            -credential_id="$CST_CREDENTIAL_ID" \
            -totp_secret="$CST_TOTP_SECRET" \
            -input_file_path="${GITHUB_WORKSPACE}/${MSI_FILE_PATH}" \
            -output_dir_path="${GITHUB_WORKSPACE}/signed-artifacts" \
            -malware_block=false
          echo "Signed MSI:"
          ls -lh "${GITHUB_WORKSPACE}/signed-artifacts/"

      - name: Verify and upload signed Windows installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== signed-artifacts/ ==="
          ls -lh signed-artifacts/ || echo "(empty)"

          # Use find + array — avoids glob expansion issues on filenames with spaces.
          # Prefer signed output; fall back to unsigned if signing produced no file.
          NSIS_FILE=$(find signed-artifacts   -name "*.exe" ! -name "*.sig" -type f | head -1)
          [[ -z "$NSIS_FILE" ]] && \
            NSIS_FILE=$(find unsigned-installers -name "*.exe" ! -name "*.sig" -type f | head -1)

          MSI_FILE=$(find signed-artifacts    -name "*.msi" ! -name "*.sig" -type f | head -1)
          [[ -z "$MSI_FILE"  ]] && \
            MSI_FILE=$(find unsigned-installers  -name "*.msi" ! -name "*.sig" -type f | head -1)

          echo "Uploading NSIS : ${NSIS_FILE:-<none>}"
          echo "Uploading MSI  : ${MSI_FILE:-<none>}"

          UPLOAD_ARGS=()
          [[ -n "$NSIS_FILE" ]] && UPLOAD_ARGS+=("$NSIS_FILE")
          [[ -n "$MSI_FILE"  ]] && UPLOAD_ARGS+=("$MSI_FILE")

          if [[ ${#UPLOAD_ARGS[@]} -eq 0 ]]; then
            echo "::error::No installer files found to upload"
            exit 1
          fi

          gh release upload "${{ needs.resolve-release.outputs.tag }}" \
            "${UPLOAD_ARGS[@]}" \
            --repo "${{ github.repository }}" \
            --clobber

  # ──────────────────────────────────────────────────────────────────────────
  # macOS: universal DMG (x86_64 + aarch64), signed + notarized
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    needs: resolve-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable + targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/confinaid-test-tool-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Certificate imported into keychain."

      - name: Build Tauri app (macOS universal — signed + notarized)
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Certificate already imported above — do NOT pass APPLE_CERTIFICATE here
          # or Tauri imports it into a second keychain, causing "ambiguous identity".
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZE_WAIT: "true"

      - name: Upload macOS installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.resolve-release.outputs.tag }}" \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            --clobber

  # ──────────────────────────────────────────────────────────────────────────
  # Linux: .AppImage + .deb
  # ──────────────────────────────────────────────────────────────────────────
  build-linux:
    needs: resolve-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            libssl-dev \
            pkg-config

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Linux)
        run: pnpm tauri build --bundles appimage,deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.resolve-release.outputs.tag }}" \
            target/release/bundle/appimage/*.AppImage \
            target/release/bundle/deb/*.deb \
            --clobber

  # ──────────────────────────────────────────────────────────────────────────
  # Generate update-manifest.json and upload it to the release.
  # Runs after all platform builds complete (sign-windows for Windows) so the
  # SHA-256 digests are computed against the final signed installers.
  # ──────────────────────────────────────────────────────────────────────────
  generate-manifest:
    needs: [resolve-release, sign-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and upload update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          node scripts/generate-manifest.mjs \
            "${{ needs.resolve-release.outputs.version }}" \
            "${{ needs.resolve-release.outputs.release_id }}"
