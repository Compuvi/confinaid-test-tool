name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Same gate as ci.yml. A tag can be pushed without ever opening a PR, so the
  # build must not assume the checks already ran.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          pnpm run lint
          pnpm run typecheck

      - name: Test
        run: pnpm run test
        env:
          CI: true

  build:
    name: Build (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: ""
          - platform: macos
            os: macos-latest
            # Universal binary so one .dmg covers Intel and Apple Silicon.
            args: "--target universal-apple-darwin"
          - platform: linux
            os: ubuntu-22.04
            args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            libsecret-1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Add Apple targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target"
          key: build-${{ matrix.platform }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Bundles are UNSIGNED. This repository has no Apple Developer ID and no
      # Windows code-signing certificate, so macOS Gatekeeper and Windows
      # SmartScreen will warn on first launch. See RELEASING.md.
      - name: Build bundles
        run: pnpm run tauri build ${{ matrix.args }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p artifacts
          # Bundle paths differ between the plain and --target builds.
          find target -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundles-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: bundles
          merge-multiple: true

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: bundles/*
          fail_on_unmatched_files: true
