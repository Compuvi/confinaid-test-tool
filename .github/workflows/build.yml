name: Build

# Triggered by the GitHub Release, NOT by the tag push.
#
# semantic-release commits "chore(release): x.y.z [skip ci]" and tags it. A tag
# push is a push event, and GitHub skips push-triggered workflows when the head
# commit message contains [skip ci] — so `on: push: tags` never fires for an
# automated release, and every release ships with zero installers attached.
# Observed exactly that on v0.1.1.
#
# The `release` event is not subject to [skip ci], so it fires reliably for both
# semantic-release and releases created by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Same gate as ci.yml. A release can be published from a tag that never went
  # through a pull request, so the build must not assume the checks already ran.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          pnpm run lint
          pnpm run typecheck

      - name: Test
        run: pnpm run test
        env:
          CI: true

  build:
    name: Build (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: ""
          - platform: macos
            os: macos-latest
            # Universal binary so one .dmg covers Intel and Apple Silicon.
            args: "--target universal-apple-darwin"
          - platform: linux
            os: ubuntu-22.04
            args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            libsecret-1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Add Apple targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target"
          key: build-${{ matrix.platform }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Bundles are UNSIGNED. This repository has no Apple Developer ID and no
      # Windows code-signing certificate, so macOS Gatekeeper and Windows
      # SmartScreen will warn on first launch. See RELEASING.md.
      - name: Build bundles
        run: pnpm run tauri build ${{ matrix.args }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p artifacts
          # Bundle paths differ between the plain and --target builds.
          find target -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundles-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: bundles
          merge-multiple: true

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: bundles/*
          fail_on_unmatched_files: true
